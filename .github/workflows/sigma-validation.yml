---
name: Sigma Validation

on:
  push:
    branches: [main]
    paths:
      - 'rules/**'
      - 'scripts/**'
      - 'requirements-dev.txt'
      - '.github/workflows/sigma-validation.yml'
  pull_request:
    paths:
      - 'rules/**'
      - 'scripts/**'
      - 'requirements-dev.txt'
      - '.github/workflows/sigma-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate rules (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Repository metadata validation
        run: python scripts/validate_rules.py

      - name: Sigma specification check
        run: sigma check rules/

      # Audits UUID uniqueness and ATT&CK tag presence across the ruleset.
      # Exits non-zero when any rule is missing a tactic or technique tag.
      - name: ATT&CK metadata audit
        run: python scripts/generate_coverage.py --check

  coverage:
    name: Coverage artefacts up to date
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Regenerate coverage
        run: python scripts/generate_coverage.py

      # Coverage is generated, not hand-maintained. If regenerating produces
      # a diff, the committed artefacts are stale.
      - name: Fail if coverage artefacts are stale
        run: |
          if ! git diff --quiet -- mappings/; then
            echo "::error::mappings/ is out of date."
            echo "Run: python scripts/generate_coverage.py"
            git diff --stat -- mappings/
            exit 1
          fi
          echo "Coverage artefacts are current."

  convert:
    name: Backend conversion smoke test
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Sigma CLI and backends
        run: |
          python -m pip install --upgrade pip
          python -m pip install sigma-cli
          sigma plugin install splunk
          sigma plugin install elasticsearch

      # Conversion is a compatibility signal, not a correctness guarantee.
      # A rule that fails to convert is usually relying on a field or
      # modifier the backend cannot express.
      - name: Convert to Splunk SPL
        run: sigma convert -t splunk -p splunk_windows rules/ > /dev/null

      - name: Convert to Elasticsearch Lucene
        run: sigma convert -t lucene -p ecs_windows rules/ > /dev/null
