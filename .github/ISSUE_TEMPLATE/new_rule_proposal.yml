---
name: New rule proposal
description: Propose a new detection before writing it
title: '[Rule]: '
labels: ['new-rule', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Proposing a rule before implementation keeps review focused on the
        detection idea rather than on YAML syntax. Rules that cannot describe
        their telemetry dependency or their evasion path are unlikely to be
        accepted.

  - type: input
    id: behaviour
    attributes:
      label: Attacker behaviour
      description: One sentence describing the observable behaviour.
      placeholder: Credential theft via LSASS process memory access
    validations:
      required: true

  - type: input
    id: attack
    attributes:
      label: ATT&CK technique
      description: Technique or sub-technique ID and name.
      placeholder: T1003.001 - OS Credential Dumping - LSASS Memory
    validations:
      required: true

  - type: dropdown
    id: logsource
    attributes:
      label: Required telemetry
      options:
        - Windows process creation
        - Windows Sysmon
        - Windows PowerShell
        - Windows security / audit
        - Linux auditd
        - Linux process creation
        - Web server access logs
        - Network / proxy / DNS
        - AWS CloudTrail
        - Microsoft 365 / Entra ID
        - Other
    validations:
      required: true

  - type: textarea
    id: logic
    attributes:
      label: Detection approach
      description: |
        Which fields and values carry the signal, and why they indicate the
        behaviour rather than the tool.
    validations:
      required: true

  - type: textarea
    id: fp
    attributes:
      label: Expected false positives
      description: |
        Realistic sources of benign matches. "None" is not an acceptable
        answer for behavioural detections.
    validations:
      required: true

  - type: textarea
    id: evasion
    attributes:
      label: Known evasion
      description: How an informed attacker would avoid this detection.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References
      description: Public research, vendor reporting, or ATT&CK documentation.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: This detection does not already exist in this repository.
          required: true
        - label: This rule is my own work, not copied from another repository.
          required: true
