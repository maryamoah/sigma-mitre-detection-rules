---
title: UAC Bypass via Fodhelper Registry Hijack
id: bc83f3e7-7d5a-41e0-b1c6-3aef826b84dc
status: experimental
description: |
    Detects creation of the ms-settings shell open command registry key used
    to hijack fodhelper.exe. Fodhelper auto-elevates without a consent prompt,
    so an attacker-controlled command in this key executes elevated. The
    registry path has no legitimate use, which makes this a high-fidelity
    detection.
references:
    - https://attack.mitre.org/techniques/T1548/002/
    - https://lolbas-project.github.io/lolbas/Binaries/Fodhelper/
author: Mary Amoah
date: 2026-08-02
tags:
    - attack.privilege_escalation
    - attack.t1548.002
    - attack.defense_evasion
logsource:
    product: windows
    category: registry_set
    definition: Requires Sysmon Event ID 13 or equivalent registry auditing.
detection:
    selection:
        TargetObject|contains:
            - '\Software\Classes\ms-settings\shell\open\command'
            - '\Software\Classes\ms-settings\CurVer'
            - '\Software\Classes\mscfile\shell\open\command'
    condition: selection
falsepositives:
    - Security testing tools validating UAC configuration. These should be
      scoped to a known test host.
level: high
