---
title: Office Application Spawning Command or Script Interpreter
id: 39d1828c-722d-4eb4-b277-766e1958198a
status: experimental
description: |
    Detects a Microsoft Office application spawning a command shell or script
    interpreter. This parent-child relationship is a reliable indicator of
    macro or exploit driven execution following a malicious document, and it
    is uncommon in normal document editing.
references:
    - https://attack.mitre.org/techniques/T1566/001/
    - https://attack.mitre.org/techniques/T1204/002/
author: Mary Amoah
date: 2026-08-02
tags:
    - attack.execution
    - attack.t1204.002
    - attack.initial_access
    - attack.t1566.001
logsource:
    product: windows
    category: process_creation
detection:
    selection_parent:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\powerpnt.exe'
            - '\outlook.exe'
            - '\msaccess.exe'
            - '\visio.exe'
    selection_child:
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\mshta.exe'
            - '\rundll32.exe'
            - '\regsvr32.exe'
            - '\bitsadmin.exe'
    filter_optional_addin_updater:
        Image|endswith: '\cmd.exe'
        CommandLine|contains: 'officeclicktorun'
    condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
    - Office add-ins and templates that legitimately shell out, particularly
      in finance environments with heavy Excel automation. Identify the
      originating document before adding an exclusion.
    - Deployment scripts distributed as macro-enabled documents.
level: high
