---
title: Process Creation via WMIC Process Call Create
id: 27263866-3eaa-452a-b6a9-ef2f3eee1e84
status: experimental
description: |
    Detects wmic.exe being used to spawn a process through the Win32_Process
    Create method. This breaks the expected parent-child chain, since the new
    process is parented by WmiPrvSE.exe rather than by wmic.exe, and is used
    both for local execution and for lateral movement when a /node argument
    is present.
references:
    - https://attack.mitre.org/techniques/T1047/
    - https://lolbas-project.github.io/lolbas/Binaries/Wmic/
author: Mary Amoah
date: 2026-08-02
tags:
    - attack.execution
    - attack.t1047
logsource:
    product: windows
    category: process_creation
detection:
    selection_img:
        - Image|endswith: '\wmic.exe'
        - OriginalFileName: 'wmic.exe'
    selection_cli:
        CommandLine|contains|all:
            - 'process'
            - 'call'
            - 'create'
    condition: all of selection_*
falsepositives:
    - Legacy administrative scripts and software deployment packages that
      still use WMIC rather than PowerShell CIM cmdlets.
    - Monitoring agents performing inventory tasks.
level: medium
