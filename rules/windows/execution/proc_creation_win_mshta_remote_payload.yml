---
title: Mshta Executing Remote or Inline Script Payload
id: 616ce859-d3da-4f45-8f4c-fcbfa91ddc7d
status: experimental
description: |
    Detects mshta.exe executing content from a remote URL or through an inline
    script protocol handler. Mshta is a signed Microsoft binary that executes
    HTML applications, allowing script execution that bypasses controls keyed
    to script interpreters. Modern environments rarely have a legitimate need
    for it.
references:
    - https://attack.mitre.org/techniques/T1218/005/
    - https://lolbas-project.github.io/lolbas/Binaries/Mshta/
author: Mary Amoah
date: 2026-08-02
tags:
    - attack.defense_evasion
    - attack.t1218.005
    - attack.execution
logsource:
    product: windows
    category: process_creation
detection:
    selection_img:
        - Image|endswith: '\mshta.exe'
        - OriginalFileName: 'MSHTA.EXE'
    selection_payload:
        CommandLine|contains:
            - 'http://'
            - 'https://'
            - 'javascript:'
            - 'vbscript:'
            - '\\\\'
    condition: all of selection_*
falsepositives:
    - Legacy line-of-business applications distributed as HTA files, typically
      launched from a fixed internal path or file share.
level: high
