---
title: Remote Service Execution via PsExec or Equivalent
id: 2b56b405-2c09-477e-8ded-7d3e75fb0ea8
status: experimental
description: |
    Detects PsExec and functionally equivalent remote execution tools by
    command line pattern and service naming. PsExec is legitimate Sysinternals
    tooling widely used by administrators, so this rule is a starting point
    for scoping lateral movement rather than a standalone alert. The strongest
    variant of this detection uses Event ID 7045 for the PSEXESVC service.
references:
    - https://attack.mitre.org/techniques/T1021/002/
    - https://learn.microsoft.com/en-us/sysinternals/downloads/psexec
author: Mary Amoah
date: 2026-08-02
tags:
    - attack.lateral_movement
    - attack.t1021.002
    - attack.execution
logsource:
    product: windows
    category: process_creation
detection:
    selection_img:
        - Image|endswith:
              - '\psexec.exe'
              - '\psexec64.exe'
              - '\paexec.exe'
              - '\csexec.exe'
        - OriginalFileName:
              - 'psexec.c'
              - 'psexec.exe'
    selection_cli:
        CommandLine|contains|all:
            - '\\\\'
            - '-u '
            - '-p '
    condition: 1 of selection_*
falsepositives:
    - Administrative use of PsExec for remote support and software deployment.
      Baseline which source hosts and accounts normally do this; execution
      from a workstation rather than a jump host is the interesting case.
level: medium
