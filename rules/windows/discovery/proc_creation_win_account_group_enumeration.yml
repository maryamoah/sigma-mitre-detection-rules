---
title: Local and Domain Account Enumeration via net.exe
id: 41b8e66f-f9da-4561-a872-bb3cd82e35f3
status: experimental
description: |
    Detects enumeration of privileged groups and accounts using net.exe or
    net1.exe. Individually these commands are unremarkable; the investigative
    value comes from several appearing in sequence from one host, which is why
    this rule is intended as hunting input rather than a paging alert.
references:
    - https://attack.mitre.org/techniques/T1087/002/
    - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/net-user
author: Mary Amoah
date: 2026-08-02
tags:
    - attack.discovery
    - attack.t1087.002
logsource:
    product: windows
    category: process_creation
detection:
    selection_img:
        - Image|endswith:
              - '\net.exe'
              - '\net1.exe'
        - OriginalFileName:
              - 'net.exe'
              - 'net1.exe'
    selection_target:
        CommandLine|contains:
            - 'group "domain admins"'
            - 'group "enterprise admins"'
            - 'localgroup administrators'
            - 'user /domain'
            - 'group /domain'
    condition: all of selection_*
falsepositives:
    - Help desk scripts verifying group membership during access requests.
    - Login scripts that map drives based on group membership.
    - Compliance tooling performing scheduled access reviews.
level: low
