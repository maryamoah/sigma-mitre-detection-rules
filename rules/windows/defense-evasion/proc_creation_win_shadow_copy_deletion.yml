---
title: Volume Shadow Copy Deletion or Recovery Disabling
id: b673f889-0d72-459d-aab8-e2d9f85975e7
status: experimental
description: |
    Detects deletion of volume shadow copies or disabling of Windows recovery
    options. This is a near-universal precursor to ransomware encryption,
    performed to prevent restoration from local snapshots. On most endpoints
    it warrants immediate response rather than queued triage.
references:
    - https://attack.mitre.org/techniques/T1490/
    - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/vssadmin-delete-shadows
author: Mary Amoah
date: 2026-08-02
tags:
    - attack.impact
    - attack.t1490
logsource:
    product: windows
    category: process_creation
detection:
    selection_vssadmin:
        CommandLine|contains|all:
            - 'vssadmin'
            - 'delete'
            - 'shadows'
    selection_wmic_shadow:
        CommandLine|contains|all:
            - 'wmic'
            - 'shadowcopy'
            - 'delete'
    selection_bcdedit:
        CommandLine|contains|all:
            - 'bcdedit'
            - 'recoveryenabled no'
    selection_bcdedit_ignore:
        CommandLine|contains|all:
            - 'bcdedit'
            - 'bootstatuspolicy'
            - 'ignoreallfailures'
    selection_wbadmin:
        CommandLine|contains|all:
            - 'wbadmin'
            - 'delete'
            - 'catalog'
    condition: 1 of selection_*
falsepositives:
    - Backup software pruning old snapshots on a defined schedule. Confirm the
      parent process is the backup agent and the timing matches its schedule.
    - Disk space remediation performed by an administrator.
level: critical
