---
title: Microsoft Defender Protection Disabled via Command Line
id: a1eaabb6-7047-4023-b756-b55ec4f5bd64
status: experimental
description: |
    Detects command lines that disable Microsoft Defender real-time
    monitoring, add broad exclusion paths, or remove signature definitions.
    Attackers commonly disable or blind Defender before staging payloads, and
    exclusion abuse is favoured because it is quieter than a full shutdown.
references:
    - https://attack.mitre.org/techniques/T1562/001/
    - https://learn.microsoft.com/en-us/powershell/module/defender/set-mppreference
author: Mary Amoah
date: 2026-08-02
tags:
    - attack.defense_evasion
    - attack.t1562.001
logsource:
    product: windows
    category: process_creation
detection:
    selection_disable:
        CommandLine|contains:
            - 'DisableRealtimeMonitoring $true'
            - 'DisableBehaviorMonitoring $true'
            - 'DisableIOAVProtection $true'
            - 'DisableScriptScanning $true'
            - 'MpPreference -Disable'
    selection_exclusion:
        CommandLine|contains|all:
            - 'Add-MpPreference'
            - 'ExclusionPath'
    selection_removedefs:
        Image|endswith: '\MpCmdRun.exe'
        CommandLine|contains: 'RemoveDefinitions'
    condition: 1 of selection_*
falsepositives:
    - Approved exclusions added by IT for line-of-business applications with
      known scanner conflicts, typically database or build servers.
    - Defender troubleshooting performed with vendor support.
level: high
