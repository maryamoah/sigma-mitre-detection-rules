title: Suspicious Rundll32 JavaScript Execution
id: f484de83-9640-48a0-9118-e074aece8196
status: experimental
description: Detects rundll32 invoking the JavaScript protocol handler through mshtml.
references:
- https://attack.mitre.org/techniques/T1218/011/
author: Mary Amoah
date: '2026-08-02'
tags:
- attack.defense_evasion
- attack.t1218.011
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: \rundll32.exe
    CommandLine|contains|all:
    - 'javascript:'
    - mshtml
  condition: selection
falsepositives:
- Legacy administrative scripts using this uncommon execution pattern.
level: high
