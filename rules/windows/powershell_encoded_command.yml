title: PowerShell Encoded Command Execution
id: 9dbfed70-58ff-4eae-8542-bd6c75fa11e9
status: experimental
description: Detects PowerShell using encoded-command switches, a common method for obscuring script content.
references:
- https://attack.mitre.org/techniques/T1059/001/
author: Mary Amoah
date: '2026-08-02'
tags:
- attack.execution
- attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith:
    - \powershell.exe
    - \pwsh.exe
    CommandLine|contains:
    - ' -enc '
    - ' -encodedcommand '
    - ' /enc '
  condition: selection
falsepositives:
- Administrative scripts or software deployment tools that intentionally encode PowerShell commands.
level: high
