---
title: Windows Service Creation From Suspicious Binary Path
id: 0a83e206-7b80-4c71-b9c2-25eca126fe08
status: experimental
description: |
    Detects service creation via sc.exe where the binary path resolves to a
    temporary or user-writable directory. Services run as SYSTEM and survive
    reboot, making them a durable persistence and privilege escalation
    mechanism. Path filtering separates this from routine software install.
references:
    - https://attack.mitre.org/techniques/T1543/003/
    - https://lolbas-project.github.io/lolbas/Binaries/Sc/
author: Mary Amoah
date: 2026-08-02
tags:
    - attack.persistence
    - attack.t1543.003
    - attack.privilege_escalation
logsource:
    product: windows
    category: process_creation
detection:
    selection_img:
        - Image|endswith: '\sc.exe'
        - OriginalFileName: 'sc.exe'
    selection_create:
        CommandLine|contains: 'create'
    selection_path:
        CommandLine|contains:
            - '\Temp\'
            - '\AppData\'
            - '\ProgramData\'
            - '\Users\Public\'
            - 'powershell'
            - 'cmd.exe /c'
    condition: all of selection_*
falsepositives:
    - Software installers that stage a service binary in ProgramData before
      relocating it. Verify the parent process is a known installer.
    - Endpoint agent deployment scripts run by IT during rollout.
level: high
