title: Network Connection to TOR SOCKS Port
id: bccf29dd-b879-4b37-8293-54b0b4e66e64
status: experimental
description: Detects outbound network connections to ports commonly used by local or remote TOR SOCKS proxies.
references:
- https://attack.mitre.org/techniques/T1090/003/
author: Mary Amoah
date: '2026-08-02'
tags:
- attack.command_and_control
- attack.t1090.003
logsource:
  product: windows
  category: network_connection
detection:
  selection:
    DestinationPort:
    - 9050
    - 9150
  condition: selection
falsepositives:
- Approved privacy tools, research systems, or sanctioned threat-intelligence activity.
level: medium
