title: Potential DNS Tunneling Query
id: 723b3a27-df47-45f0-b916-751e3c00e382
status: experimental
description: Detects unusually long DNS query names that may indicate encoded data transfer.
references:
- https://attack.mitre.org/techniques/T1071/004/
author: Mary Amoah
date: '2026-08-02'
tags:
- attack.command_and_control
- attack.t1071.004
logsource:
  product: dns
detection:
  selection:
    query|re: (?i)(?:[a-z0-9]{30,}\.){2,}[a-z]{2,}$
  condition: selection
falsepositives:
- Content delivery networks, anti-spam systems, telemetry, or domain-control validation records.
level: medium
