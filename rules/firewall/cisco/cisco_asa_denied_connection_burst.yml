---
title: Cisco ASA Repeated Denied Inbound Connections
id: e96e8ace-86bf-42ab-bce9-43a18c9c1a48
status: experimental
description: |
    Detects connection denial events on Cisco ASA, the base signal for
    external port scanning and service discovery. Individual denials are
    routine internet background noise. Aggregate by source address and count
    distinct destination ports before alerting, otherwise this will overwhelm
    any perimeter-facing deployment.
references:
    - https://attack.mitre.org/techniques/T1595/001/
    - https://www.cisco.com/c/en/us/td/docs/security/asa/syslog/b_syslog.html
author: Mary Amoah
date: 2026-08-02
tags:
    - attack.reconnaissance
    - attack.t1595.001
logsource:
    product: cisco
    service: asa
    definition: |
        Cisco ASA syslog. Message ID 106023 denotes a deny by access-group;
        106001 and 106006 cover denied inbound TCP and UDP. This rule selects
        raw denial events and requires SIEM-side aggregation to be useful.
detection:
    selection_msgid:
        message_id:
            - '106023'
            - '106001'
            - '106006'
            - '106007'
    selection_action:
        action: 'deny'
    condition: 1 of selection_*
falsepositives:
    - Ordinary internet scanning noise against any internet-facing interface.
      On a perimeter firewall this rule matches continuously by design.
    - Misconfigured internal clients repeatedly attempting a blocked service.
    - Authorised external vulnerability scanning.
level: informational
