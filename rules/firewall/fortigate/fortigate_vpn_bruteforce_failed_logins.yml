---
title: FortiGate SSL VPN Authentication Failure Burst
id: cc23a39b-934b-420e-b04c-ac996b458bb4
status: experimental
description: |
    Detects failed SSL VPN authentication events. A single failure is
    meaningless; the detection value comes from aggregating failures by
    source address or by account over a short window, which requires a
    correlation rule or a SIEM-side threshold. This rule provides the base
    event selection for that aggregation.
references:
    - https://attack.mitre.org/techniques/T1110/
    - https://docs.fortinet.com/document/fortigate/latest/fortios-log-message-reference
author: Mary Amoah
date: 2026-08-02
tags:
    - attack.credential_access
    - attack.t1110
    - attack.initial_access
logsource:
    product: fortigate
    service: vpn
    definition: |
        FortiGate VPN event logs. This rule selects individual failure events
        only. Apply a threshold in your SIEM, or wrap it in a Sigma
        correlation rule, before using it as an alert source.
detection:
    selection:
        action: 'ssl-login-fail'
    selection_alt:
        - logid: '0101039426'
        - status: 'failure'
          subtype: 'vpn'
    condition: 1 of selection*
falsepositives:
    - Users with expired or recently rotated passwords, which produce
      clustered failures from a single legitimate source.
    - Misconfigured VPN clients retrying automatically after a certificate or
      profile change.
    - Password managers autofilling stale credentials.
level: low
