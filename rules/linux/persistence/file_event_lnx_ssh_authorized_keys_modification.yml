---
title: SSH Authorized Keys File Modified
id: 150523ac-9dbf-48e8-9e60-34dc3d3d27d0
status: experimental
description: |
    Detects modification of an SSH authorized_keys file. Appending a public
    key grants durable passwordless access that survives password rotation
    and is frequently overlooked during incident containment. Modification of
    the root account's keys is particularly significant.
references:
    - https://attack.mitre.org/techniques/T1098/004/
    - https://man.openbsd.org/sshd.8
author: Mary Amoah
date: 2026-08-02
tags:
    - attack.persistence
    - attack.t1098.004
    - attack.lateral_movement
logsource:
    product: linux
    category: file_event
detection:
    selection:
        TargetFilename|endswith:
            - '/.ssh/authorized_keys'
            - '/.ssh/authorized_keys2'
    filter_optional_provisioning:
        Image|endswith:
            - '/cloud-init'
            - '/ansible-tmp'
    condition: selection and not 1 of filter_optional_*
falsepositives:
    - Key rotation performed by configuration management or by cloud instance
      provisioning agents on first boot.
    - Developers adding their own keys to development hosts.
level: medium
