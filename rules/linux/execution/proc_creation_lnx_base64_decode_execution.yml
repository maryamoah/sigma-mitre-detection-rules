---
title: Base64 Decoded Payload Piped to Interpreter
id: f611fa34-78e4-4ce4-bd28-b8b36189693c
status: experimental
description: |
    Detects base64 decoding chained into a shell or scripting interpreter.
    Encoding conceals the payload from command line inspection and from
    simple keyword matching, and is a routine step in dropper scripts and
    in cron-based persistence.
references:
    - https://attack.mitre.org/techniques/T1027/
    - https://attack.mitre.org/techniques/T1140/
author: Mary Amoah
date: 2026-08-02
tags:
    - attack.defense_evasion
    - attack.t1027
    - attack.t1140
    - attack.execution
logsource:
    product: linux
    category: process_creation
detection:
    selection_decode:
        CommandLine|contains:
            - 'base64 -d'
            - 'base64 --decode'
            - 'base64 -di'
            - 'openssl enc -d -base64'
    selection_exec:
        CommandLine|contains:
            - '| bash'
            - '| sh'
            - '|bash'
            - '|sh'
            - '| python'
            - 'eval'
    condition: all of selection_*
falsepositives:
    - Configuration management tooling that ships encoded payloads, notably
      cloud-init user data and container entrypoint scripts.
level: high
