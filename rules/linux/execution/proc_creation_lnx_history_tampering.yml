---
title: Shell History Cleared or Logging Disabled
id: 513efd5d-ee6c-4c93-8eb8-506f523b4600
status: experimental
description: |
    Detects clearing of shell history or unsetting of history environment
    variables. Disabling history is an anti-forensic step taken before or
    after hands-on-keyboard activity, and unlike log clearing it requires no
    privilege, making it common in the earliest stage of a compromise.
references:
    - https://attack.mitre.org/techniques/T1070/003/
    - https://www.gnu.org/software/bash/manual/html_node/Bash-History-Facilities.html
author: Mary Amoah
date: 2026-08-02
tags:
    - attack.defense_evasion
    - attack.t1070.003
logsource:
    product: linux
    category: process_creation
detection:
    selection_unset:
        CommandLine|contains:
            - 'unset HISTFILE'
            - 'export HISTFILESIZE=0'
            - 'export HISTSIZE=0'
            - 'set +o history'
    selection_clear:
        CommandLine|contains:
            - 'history -c'
            - 'history -w'
    selection_delete:
        CommandLine|contains:
            - 'rm .bash_history'
            - 'rm ~/.bash_history'
            - 'rm -f ~/.bash_history'
            - '/dev/null > ~/.bash_history'
            - 'truncate -s0 ~/.bash_history'
    condition: 1 of selection_*
falsepositives:
    - Users clearing history after mistakenly typing a password at the prompt.
      This is a legitimate and reasonably common action.
    - Shell profile customisation on shared administrative hosts.
level: medium
