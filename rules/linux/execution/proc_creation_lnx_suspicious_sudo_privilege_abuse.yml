---
title: Privilege Escalation via GTFOBins Interpreter Under Sudo
id: dfecca64-81c7-4333-bf7d-ca96747f1b32
status: experimental
description: |
    Detects sudo invoking binaries that can spawn a shell or read arbitrary
    files, a route to root when a narrow sudoers entry is granted without
    considering the binary's full capability. Detection here depends heavily
    on which binaries are actually permitted in your sudoers policy, so tune
    the list to your environment.
references:
    - https://attack.mitre.org/techniques/T1548/003/
    - https://gtfobins.github.io/
author: Mary Amoah
date: 2026-08-02
tags:
    - attack.privilege_escalation
    - attack.t1548.003
logsource:
    product: linux
    category: process_creation
detection:
    selection_sudo:
        CommandLine|startswith: 'sudo '
    selection_binary:
        CommandLine|contains:
            - 'sudo find '
            - 'sudo vim'
            - 'sudo vi '
            - 'sudo less '
            - 'sudo more '
            - 'sudo awk '
            - 'sudo nmap'
            - 'sudo perl'
            - 'sudo python'
            - 'sudo tar '
    selection_escape:
        CommandLine|contains:
            - '-exec'
            - '!/bin/sh'
            - '!/bin/bash'
            - '--interactive'
            - 'os.system'
            - '--checkpoint-action'
    condition: selection_sudo and selection_binary and selection_escape
falsepositives:
    - Administrators using find with -exec for legitimate maintenance, which
      is common. Review the executed command rather than the match alone.
    - Backup scripts invoking tar with checkpoint actions.
level: high
