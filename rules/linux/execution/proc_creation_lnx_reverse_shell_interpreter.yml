---
title: Interactive Reverse Shell via Shell Redirection
id: 050cc5f7-6f00-4b9a-a59e-8a31d06629ce
status: experimental
description: |
    Detects shell invocations that redirect an interactive session to a
    network socket, the canonical Unix reverse shell. Bash exposes
    /dev/tcp and /dev/udp as pseudo-devices, so a full callback requires no
    additional tooling on the host. The pairing of an interactive flag with a
    socket path is what carries the signal.
references:
    - https://attack.mitre.org/techniques/T1059/004/
    - https://gtfobins.github.io/gtfobins/bash/
author: Mary Amoah
date: 2026-08-02
tags:
    - attack.execution
    - attack.t1059.004
    - attack.command_and_control
logsource:
    product: linux
    category: process_creation
    definition: |
        Requires auditd execve logging or Sysmon for Linux Event ID 1.
        A bare auditd ruleset without execve rules will not populate the
        command line and this rule will never fire.
detection:
    selection_devtcp:
        CommandLine|contains:
            - '/dev/tcp/'
            - '/dev/udp/'
    selection_interactive:
        CommandLine|contains:
            - 'sh -i'
            - 'bash -i'
            - 'zsh -i'
    selection_named_pipe:
        CommandLine|contains|all:
            - 'mkfifo'
            - 'nc '
    condition: (selection_devtcp and selection_interactive) or selection_named_pipe
falsepositives:
    - Connectivity testing by administrators, who occasionally use /dev/tcp to
      check whether a port is reachable. These lack the interactive flag.
    - Security training and CTF activity on non-production hosts.
level: high
