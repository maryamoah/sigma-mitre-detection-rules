title: Linux Sudoers File Modified
id: bec5f2a3-cd3f-47c6-a6d8-e916b4ae8f32
status: experimental
description: Detects modifications to sudoers configuration files.
references:
- https://attack.mitre.org/techniques/T1548/003/
author: Mary Amoah
date: '2026-08-02'
tags:
- attack.privilege_escalation
- attack.t1548.003
logsource:
  product: linux
  category: file_event
detection:
  selection:
    TargetFilename|startswith:
    - /etc/sudoers
    - /etc/sudoers.d/
  condition: selection
falsepositives:
- Authorized privilege-policy updates by administrators or configuration-management systems.
level: high
