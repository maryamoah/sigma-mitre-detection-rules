title: Suspicious Curl or Wget Download to Temporary Directory
id: 7e95bc31-d3a7-4af5-a91e-b422d559f395
status: experimental
description: Detects command-line downloads written into common temporary directories.
references:
- https://attack.mitre.org/techniques/T1105/
author: Mary Amoah
date: '2026-08-02'
tags:
- attack.command_and_control
- attack.t1105
logsource:
  product: linux
  category: process_creation
detection:
  selection_image:
    Image|endswith:
    - /curl
    - /wget
  selection_path:
    CommandLine|contains:
    - /tmp/
    - /var/tmp/
    - /dev/shm/
  condition: selection_image and selection_path
falsepositives:
- Package installation scripts, CI/CD jobs, or approved bootstrap scripts.
level: medium
