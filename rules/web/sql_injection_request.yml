title: Web Request Contains SQL Injection Keywords
id: 4cb29a8f-ac22-464b-8853-66166bbbbfd3
status: experimental
description: Detects web requests containing common SQL injection syntax and database enumeration patterns.
references:
- https://attack.mitre.org/techniques/T1190/
author: Mary Amoah
date: '2026-08-02'
tags:
- attack.initial_access
- attack.t1190
logsource:
  product: webserver
  category: web
detection:
  selection:
    url|contains:
    - union select
    - information_schema
    - sleep(
    - benchmark(
    - or 1=1
    - xp_cmdshell
  condition: selection
falsepositives:
- Security scanners, penetration testing, malformed search queries, or application content containing SQL syntax.
level: high
