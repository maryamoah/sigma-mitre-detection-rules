title: Suspicious Email Attachment Type
id: 14f27f4f-63e7-4602-8e85-6ba11fb4bde9
status: experimental
description: Detects inbound email attachments using executable or script-capable extensions.
references:
- https://attack.mitre.org/techniques/T1566/001/
author: Mary Amoah
date: '2026-08-02'
tags:
- attack.initial_access
- attack.t1566.001
logsource:
  product: m365
  service: audit
detection:
  selection:
    AttachmentName|endswith:
    - .exe
    - .scr
    - .js
    - .jse
    - .vbs
    - .vbe
    - .hta
    - .lnk
    - .iso
    - .img
  condition: selection
falsepositives:
- Legitimate software distribution, security testing, or administrator-to-administrator transfers.
level: medium
