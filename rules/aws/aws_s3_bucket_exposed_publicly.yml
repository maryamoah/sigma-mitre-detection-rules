---
title: AWS S3 Bucket Policy or ACL Opened to Public Access
id: 61c8c33c-e080-4a96-9b92-b5ab4b8da5c3
status: experimental
description: |
    Detects modification of S3 bucket policies, ACLs or public access block
    settings. Removing a public access block or applying a permissive policy
    is the mechanism behind most large-scale cloud data exposures, and it is
    frequently a misconfiguration rather than an attack, which makes it worth
    catching either way.
references:
    - https://attack.mitre.org/techniques/T1530/
    - https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-control-block-public-access.html
author: Mary Amoah
date: 2026-08-02
tags:
    - attack.collection
    - attack.t1530
    - attack.exfiltration
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: 's3.amazonaws.com'
        eventName:
            - 'PutBucketPolicy'
            - 'PutBucketAcl'
            - 'DeleteBucketPolicy'
            - 'PutBucketPublicAccessBlock'
            - 'DeletePublicAccessBlock'
    filter_main_error:
        errorCode|contains: 'AccessDenied'
    condition: selection and not filter_main_error
falsepositives:
    - Legitimate hosting of public static assets, which requires exactly these
      API calls. Maintain an allowlist of buckets intended to be public.
    - Infrastructure-as-code applying a policy on every deployment run.
level: high
