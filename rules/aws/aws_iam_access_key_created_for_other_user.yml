---
title: AWS IAM Access Key Created or Login Profile Added
id: 7359b547-13b6-4f13-b691-91f0750d4f19
status: experimental
description: |
    Detects creation of IAM access keys and login profiles. Adding a
    programmatic key to an existing privileged identity is a common
    persistence step, because the key survives console password rotation and
    MFA changes. Key creation for an identity other than the caller deserves
    particular scrutiny.
references:
    - https://attack.mitre.org/techniques/T1098/001/
    - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html
author: Mary Amoah
date: 2026-08-02
tags:
    - attack.persistence
    - attack.t1098.001
    - attack.credential_access
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: 'iam.amazonaws.com'
        eventName:
            - 'CreateAccessKey'
            - 'CreateLoginProfile'
            - 'UpdateLoginProfile'
    filter_main_error:
        errorCode|contains:
            - 'AccessDenied'
            - 'NoSuchEntity'
    condition: selection and not filter_main_error
falsepositives:
    - Normal user onboarding and key rotation. Both are routine, so the
      investigative question is whether the caller normally performs this and
      whether the target identity is privileged.
    - Automation provisioning service accounts.
level: medium
