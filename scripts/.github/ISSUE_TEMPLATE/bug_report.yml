---
name: Bug report
description: A rule, script, or document behaves incorrectly
title: '[Bug]: '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report.

        If the issue is that a rule produces excessive benign alerts in your
        environment, please use the **False positive report** template instead —
        that is tuning feedback rather than a defect.

  - type: input
    id: affected
    attributes:
      label: Affected file
      description: Path to the rule, script, or document.
      placeholder: rules/windows/process_creation/win_susp_lsass_access.yml
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the exact error output where relevant.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: dropdown
    id: siem
    attributes:
      label: Backend or SIEM
      description: Where the problem surfaced. Select N/A for documentation issues.
      options:
        - N/A
        - Microsoft Sentinel
        - Splunk
        - Elastic
        - Wazuh
        - QRadar
        - Other
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Tooling versions
      description: Output of `sigma version` and `python --version` if applicable.
      placeholder: sigma-cli 1.0.5, Python 3.12.3

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: |
        Logs, screenshots, or converted queries.
        Redact hostnames, usernames, IP addresses, and any customer data.

  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues for a duplicate.
          required: true
        - label: This report contains no proprietary or customer data.
          required: true
