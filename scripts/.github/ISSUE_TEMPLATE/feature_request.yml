---
name: Feature request
description: Suggest tooling, documentation, or repository improvements
title: '[Feature]: '
labels: ['enhancement', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Use this template for tooling, CI, documentation, or structural changes.
        To propose a new detection, use the **New rule proposal** template.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult, slow, or unreliable today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Including why the current approach is insufficient.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Rules
        - Documentation
        - CI / validation
        - ATT&CK mappings
        - SIEM conversion examples
        - Repository structure
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this.
