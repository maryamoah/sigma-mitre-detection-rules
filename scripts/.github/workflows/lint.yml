---
name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yaml:
    name: YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yamllint
        run: python -m pip install yamllint

      - name: Run yamllint
        run: yamllint --strict .

  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: '**/*.md'

  links:
    name: Internal link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only relative links are checked on push and pull request. Broken
      # internal links are always a repository defect and are worth blocking
      # a merge. External links are checked on a schedule instead -- the rule
      # references point at attack.mitre.org and vendor documentation, which
      # rate-limit aggressively enough to make them an unreliable merge gate.
      - name: Check relative links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --exclude-path ./.git
            './**/*.md'
          fail: true
