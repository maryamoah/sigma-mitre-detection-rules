---
title: Microsoft 365 eDiscovery Search Created or Exported
id: 91d6733e-60ff-4b1d-bbe8-18fc9d870431
status: experimental
description: |
    Detects creation and export of compliance searches. eDiscovery can read
    and export content from any mailbox or site in the tenant, making it a
    powerful collection tool for an attacker holding a compliance role. Use is
    infrequent and normally restricted to a small named group, so unexpected
    use is meaningful.
references:
    - https://attack.mitre.org/techniques/T1114/002/
    - https://learn.microsoft.com/en-us/purview/ediscovery-standard-get-started
author: Mary Amoah
date: 2026-08-02
tags:
    - attack.collection
    - attack.t1114.002
    - attack.exfiltration
logsource:
    product: m365
    service: threat_management
detection:
    selection:
        Operation:
            - 'New-ComplianceSearch'
            - 'Start-ComplianceSearch'
            - 'New-ComplianceSearchAction'
            - 'SearchExported'
            - 'SearchCreated'
    condition: selection
falsepositives:
    - Legal hold, HR investigation and compliance work, which is the intended
      use. Maintain a list of authorised eDiscovery operators and review any
      activity outside it.
level: medium
