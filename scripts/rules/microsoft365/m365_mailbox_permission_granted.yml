---
title: Microsoft 365 Mailbox Delegation or Full Access Granted
id: 35ded5a4-8d6b-4fae-9e0e-f951eb73eac4
status: experimental
description: |
    Detects mailbox permissions being granted to another principal, including
    FullAccess and SendAs. Delegation gives persistent read access to a
    mailbox without needing the owner's credentials, and is used both for
    collection and to maintain access after a compromised password is reset.
references:
    - https://attack.mitre.org/techniques/T1098/002/
    - https://learn.microsoft.com/en-us/exchange/recipients/mailbox-permissions
author: Mary Amoah
date: 2026-08-02
tags:
    - attack.persistence
    - attack.t1098.002
    - attack.collection
logsource:
    product: m365
    service: exchange
detection:
    selection:
        Operation:
            - 'Add-MailboxPermission'
            - 'Add-RecipientPermission'
            - 'Add-MailboxFolderPermission'
    selection_rights:
        Parameters|contains:
            - 'FullAccess'
            - 'SendAs'
            - 'SendOnBehalf'
    condition: all of selection*
falsepositives:
    - Shared mailbox provisioning and executive assistant delegation, both of
      which are common and legitimate. Grants to recently created or external
      accounts are the interesting subset.
    - Migration tooling applying permissions in bulk.
level: medium
