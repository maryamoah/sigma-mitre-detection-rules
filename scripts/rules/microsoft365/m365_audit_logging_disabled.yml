---
title: Microsoft 365 Audit Logging Disabled
id: 9153500e-32d9-42fb-8fe5-f5389a69e78b
status: experimental
description: |
    Detects disabling of unified audit logging or mailbox audit logging.
    Turning off auditing removes the record of subsequent activity across
    Exchange, SharePoint and Teams, and is a deliberate anti-forensic action
    with no routine operational justification.
references:
    - https://attack.mitre.org/techniques/T1562/008/
    - https://learn.microsoft.com/en-us/purview/audit-log-enable-disable
author: Mary Amoah
date: 2026-08-02
tags:
    - attack.defense_evasion
    - attack.t1562.008
logsource:
    product: m365
    service: exchange
detection:
    selection_unified:
        Operation: 'Set-AdminAuditLogConfig'
        Parameters|contains: 'UnifiedAuditLogIngestionEnabled'
    selection_mailbox:
        Operation: 'Set-Mailbox'
        Parameters|contains: 'AuditEnabled'
    condition: 1 of selection_*
falsepositives:
    - Tenant migration or licensing changes where audit configuration is
      rebuilt. This should be rare and correlate with a change record.
level: critical
