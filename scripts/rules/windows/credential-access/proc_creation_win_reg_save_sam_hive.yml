---
title: Registry Hive Export of SAM SYSTEM or SECURITY
id: 478f727c-0950-4f78-81ab-680a832e668f
status: experimental
description: |
    Detects reg.exe saving the SAM, SYSTEM or SECURITY hives to a file. Offline
    export of these hives allows local account hashes and the boot key to be
    recovered on attacker infrastructure, avoiding LSASS access entirely.
    Administrators do this occasionally during migrations, so parent process
    context matters.
references:
    - https://attack.mitre.org/techniques/T1003/002/
    - https://lolbas-project.github.io/lolbas/Binaries/Reg/
author: Mary Amoah
date: 2026-08-02
tags:
    - attack.credential_access
    - attack.t1003.002
logsource:
    product: windows
    category: process_creation
detection:
    selection_img:
        - Image|endswith: '\reg.exe'
        - OriginalFileName: 'reg.exe'
    selection_action:
        CommandLine|contains: 'save'
    selection_hive:
        CommandLine|contains:
            - 'hklm\sam'
            - 'hklm\system'
            - 'hklm\security'
            - 'hklm\\sam'
            - 'hklm\\system'
            - 'hklm\\security'
    condition: all of selection_*
falsepositives:
    - Documented backup or system migration procedures. These should be
      identifiable by a scheduled parent process and a consistent output path.
    - Security baseline tooling that snapshots registry state before changes.
level: high
