---
title: Windows Credential Manager Enumeration via VaultCmd
id: 6a02308f-8eef-46e3-8b16-5237ae353ecc
status: experimental
description: |
    Detects VaultCmd.exe listing stored credentials from Windows Credential
    Manager. This is a low-noise post-exploitation step used to harvest saved
    RDP, browser and network credentials without touching LSASS, and it
    requires no elevation.
references:
    - https://attack.mitre.org/techniques/T1555/004/
    - https://lolbas-project.github.io/lolbas/Binaries/Vaultcmd/
author: Mary Amoah
date: 2026-08-02
tags:
    - attack.credential_access
    - attack.t1555.004
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        - Image|endswith: '\vaultcmd.exe'
        - OriginalFileName: 'VAULTCMD.EXE'
    selection_args:
        CommandLine|contains:
            - '/list'
            - '/listcreds'
            - '/listproperties'
    condition: all of selection*
falsepositives:
    - Help desk scripts that inventory stored credentials during user profile
      troubleshooting or migration.
level: medium
