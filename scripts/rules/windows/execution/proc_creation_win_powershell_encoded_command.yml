---
title: PowerShell Encoded Command Execution
id: be2cc476-12c2-4d50-a332-65fd7f66c7f7
status: experimental
description: |
    Detects PowerShell invoked with an encoded command argument. Base64
    encoding hides the payload from casual command line inspection and is
    heavily used by loaders and post-exploitation frameworks. Legitimate
    management tooling also uses it, so this rule is a triage starting point
    rather than a standalone alert in most environments.
references:
    - https://attack.mitre.org/techniques/T1059/001/
    - https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_powershell_exe
author: Mary Amoah
date: 2026-08-02
tags:
    - attack.execution
    - attack.t1059.001
    - attack.defense_evasion
    - attack.t1027
logsource:
    product: windows
    category: process_creation
detection:
    selection_img:
        - Image|endswith:
              - '\powershell.exe'
              - '\pwsh.exe'
        - OriginalFileName:
              - 'PowerShell.EXE'
              - 'pwsh.dll'
    selection_encoded:
        CommandLine|contains:
            - ' -enc '
            - ' -enco'
            - ' -e '
            - ' -ec '
            - '-EncodedCommand'
    condition: all of selection_*
falsepositives:
    - Configuration management platforms such as SCCM, Intune or Ansible,
      which routinely wrap PowerShell payloads in encoded form.
    - Software installers that invoke encoded bootstrap scripts.
    - Scheduled tasks created by legitimate administrative automation.
level: medium
