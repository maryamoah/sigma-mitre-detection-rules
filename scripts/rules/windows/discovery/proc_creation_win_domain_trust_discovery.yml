---
title: Active Directory Domain and Trust Discovery
id: a9cd51f8-3a26-4931-9ac3-6b325571e956
status: experimental
description: |
    Detects enumeration of domain trusts and domain controllers using nltest
    or dsquery. Trust enumeration typically occurs early after a foothold, as
    an operator maps the forest before selecting a privilege escalation path.
    It is uncommon from a standard user workstation.
references:
    - https://attack.mitre.org/techniques/T1482/
    - https://lolbas-project.github.io/lolbas/OtherMSBinaries/Nltest/
author: Mary Amoah
date: 2026-08-02
tags:
    - attack.discovery
    - attack.t1482
logsource:
    product: windows
    category: process_creation
detection:
    selection_nltest:
        Image|endswith: '\nltest.exe'
        CommandLine|contains:
            - 'domain_trusts'
            - 'dclist'
            - 'all_trusts'
    selection_dsquery:
        CommandLine|contains|all:
            - 'dsquery'
            - 'trustedDomain'
    condition: 1 of selection_*
falsepositives:
    - Directory health checks run by domain administrators or by AD monitoring
      tooling. Expect these from management servers, not from workstations.
level: medium
