---
title: Remote Execution via WinRM and PowerShell Remoting
id: 9412f2d6-2617-47c3-b7a8-06d77219df45
status: experimental
description: |
    Detects processes spawned by the WinRM host process, and PowerShell
    remoting cmdlets targeting remote computers. Because WSMProvHost.exe
    parents anything executed through a remoting session, the parent-child
    relationship is a durable indicator regardless of the payload.
references:
    - https://attack.mitre.org/techniques/T1021/006/
    - https://learn.microsoft.com/en-us/powershell/scripting/security/remoting/winrmsecurity
author: Mary Amoah
date: 2026-08-02
tags:
    - attack.lateral_movement
    - attack.t1021.006
    - attack.execution
logsource:
    product: windows
    category: process_creation
detection:
    selection_parent:
        ParentImage|endswith: '\wsmprovhost.exe'
    selection_cmdlet:
        CommandLine|contains:
            - 'Invoke-Command -ComputerName'
            - 'Enter-PSSession -ComputerName'
            - 'New-PSSession -ComputerName'
    condition: 1 of selection_*
falsepositives:
    - Configuration management and monitoring platforms that use PowerShell
      remoting as their primary transport. Baseline the source hosts.
    - Administrators managing servers from a jump host.
level: medium
