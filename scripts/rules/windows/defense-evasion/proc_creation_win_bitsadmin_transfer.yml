---
title: Remote File Transfer via BITSAdmin
id: b0d72b40-2b5b-437f-8918-f21f9accb1d7
status: experimental
description: |
    Detects bitsadmin.exe creating a transfer job to download or upload a
    file. BITS transfers are performed by a system service, so the network
    connection is not attributed to the calling process, and jobs persist
    across reboots. Both properties make BITS attractive for quiet payload
    staging and exfiltration.
references:
    - https://attack.mitre.org/techniques/T1197/
    - https://lolbas-project.github.io/lolbas/Binaries/Bitsadmin/
author: Mary Amoah
date: 2026-08-02
tags:
    - attack.defense_evasion
    - attack.t1197
    - attack.command_and_control
    - attack.t1105
logsource:
    product: windows
    category: process_creation
detection:
    selection_img:
        - Image|endswith: '\bitsadmin.exe'
        - OriginalFileName: 'bitsadmin.exe'
    selection_action:
        CommandLine|contains:
            - '/transfer'
            - '/create'
            - '/addfile'
            - '/setnotifycmdline'
    condition: all of selection_*
falsepositives:
    - Legacy patch distribution and software deployment scripts that use BITS
      for bandwidth-throttled downloads from an internal server.
level: medium
