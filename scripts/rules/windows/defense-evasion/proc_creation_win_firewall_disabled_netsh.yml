---
title: Windows Firewall Disabled or Rules Purged via netsh
id: 38d3a64e-3dab-4eb4-9bc3-c411bad99c99
status: experimental
description: |
    Detects netsh.exe turning off the Windows firewall for one or more
    profiles, or resetting the rule set. Disabling host firewalling is used to
    enable inbound tooling and lateral movement, and is rarely appropriate
    outside a controlled maintenance window.
references:
    - https://attack.mitre.org/techniques/T1562/004/
    - https://learn.microsoft.com/en-us/windows-server/networking/technologies/netsh/netsh-contexts
author: Mary Amoah
date: 2026-08-02
tags:
    - attack.defense_evasion
    - attack.t1562.004
logsource:
    product: windows
    category: process_creation
detection:
    selection_img:
        - Image|endswith: '\netsh.exe'
        - OriginalFileName: 'netsh.exe'
    selection_action:
        - CommandLine|contains|all:
              - 'firewall'
              - 'state off'
        - CommandLine|contains|all:
              - 'advfirewall'
              - 'set'
              - 'off'
        - CommandLine|contains|all:
              - 'advfirewall'
              - 'reset'
    condition: all of selection_*
falsepositives:
    - Imaging and provisioning scripts that reset firewall state before
      applying a baseline policy.
    - Troubleshooting of network connectivity by IT support, which should be
      short-lived and correlate with a ticket.
level: high
