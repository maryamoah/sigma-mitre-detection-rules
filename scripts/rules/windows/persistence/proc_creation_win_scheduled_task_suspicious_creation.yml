---
title: Scheduled Task Creation With Suspicious Action or SYSTEM Context
id: c69a0e14-2913-4c92-8cb0-c2380f6de1c5
status: experimental
description: |
    Detects schtasks.exe creating a task that runs a script interpreter, runs
    as SYSTEM, or executes from a user-writable path. Scheduled tasks are the
    most common persistence mechanism across commodity and targeted intrusions
    because they are durable, flexible and administratively unremarkable.
references:
    - https://attack.mitre.org/techniques/T1053/005/
    - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/schtasks
author: Mary Amoah
date: 2026-08-02
tags:
    - attack.persistence
    - attack.t1053.005
    - attack.execution
logsource:
    product: windows
    category: process_creation
detection:
    selection_img:
        - Image|endswith: '\schtasks.exe'
        - OriginalFileName: 'schtasks.exe'
    selection_create:
        CommandLine|contains: '/create'
    selection_suspicious:
        CommandLine|contains:
            - 'powershell'
            - 'mshta'
            - 'rundll32'
            - 'regsvr32'
            - 'wscript'
            - 'cscript'
            - 'curl'
            - '\AppData\'
            - '\Temp\'
            - '/ru system'
            - '/ru "system"'
    condition: all of selection_*
falsepositives:
    - Software updaters registering maintenance tasks, which frequently run as
      SYSTEM. Identify the vendor by the task name and the parent process.
    - Configuration management platforms deploying scheduled automation.
level: medium
