---
title: Azure Privileged Directory Role Assigned
id: 3fa8237e-c8a5-4670-8f95-8b8407f34bb4
status: experimental
description: |
    Detects assignment of members to Entra ID directory roles. Global
    Administrator and Privileged Role Administrator grant effective control of
    the tenant, and self-assignment or assignment to a recently created
    account is a common escalation path after an initial identity compromise.
references:
    - https://attack.mitre.org/techniques/T1098/003/
    - https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/permissions-reference
author: Mary Amoah
date: 2026-08-02
tags:
    - attack.persistence
    - attack.t1098.003
    - attack.privilege_escalation
logsource:
    product: azure
    service: auditlogs
detection:
    selection:
        properties.message:
            - 'Add member to role'
            - 'Add eligible member to role'
            - 'Add member to role in PIM completed'
    condition: selection
falsepositives:
    - Legitimate administrative onboarding and role changes, which should
      correlate with an access request. Assignment of Global Administrator is
      rare enough in most tenants to review every occurrence.
    - Privileged Identity Management activating a pre-approved eligible role.
level: high
