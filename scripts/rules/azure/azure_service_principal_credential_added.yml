---
title: Credential Added to Azure Application or Service Principal
id: 5c6906bc-e14a-4ecb-92f6-435f404d8146
status: experimental
description: |
    Detects addition of client secrets or certificates to application
    registrations and service principals. A credential attached to an existing
    privileged application grants durable non-interactive access that is not
    covered by user MFA and is easily missed during incident response, since
    attention usually focuses on user accounts.
references:
    - https://attack.mitre.org/techniques/T1098/001/
    - https://learn.microsoft.com/en-us/entra/identity-platform/howto-create-service-principal-portal
author: Mary Amoah
date: 2026-08-02
tags:
    - attack.persistence
    - attack.t1098.001
    - attack.credential_access
logsource:
    product: azure
    service: auditlogs
detection:
    selection:
        properties.message:
            - 'Add service principal credentials'
            - 'Update application - Certificates and secrets management'
            - 'Update service principal'
    condition: selection
falsepositives:
    - Routine secret rotation, which is expected practice and will generate
      regular matches. Baseline which applications rotate and how often.
    - Developers registering new applications in a development tenant.
level: medium
