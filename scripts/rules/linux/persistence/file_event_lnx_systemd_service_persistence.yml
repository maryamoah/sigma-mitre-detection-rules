---
title: Systemd Unit File Created in Persistence Path
id: 6709a280-d3f3-414f-a7be-4c9195f475b6
status: experimental
description: |
    Detects creation of systemd unit files in service directories, including
    user-scoped units. Systemd services start automatically, restart on
    failure and run with the privileges of the unit, which makes them an
    attractive alternative to cron for durable persistence.
references:
    - https://attack.mitre.org/techniques/T1543/002/
    - https://man7.org/linux/man-pages/man5/systemd.service.5.html
author: Mary Amoah
date: 2026-08-02
tags:
    - attack.persistence
    - attack.t1543.002
    - attack.privilege_escalation
logsource:
    product: linux
    category: file_event
detection:
    selection:
        TargetFilename|contains:
            - '/etc/systemd/system/'
            - '/usr/lib/systemd/system/'
            - '/lib/systemd/system/'
            - '/.config/systemd/user/'
        TargetFilename|endswith:
            - '.service'
            - '.timer'
    filter_optional_package_manager:
        Image|endswith:
            - '/dpkg'
            - '/rpm'
            - '/yum'
            - '/dnf'
    condition: selection and not 1 of filter_optional_*
falsepositives:
    - Software installation through package managers, filtered above where
      the installing process is visible.
    - Container and orchestration tooling registering runtime units.
level: medium
