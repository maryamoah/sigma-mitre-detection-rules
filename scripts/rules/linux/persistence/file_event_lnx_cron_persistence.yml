---
title: Cron Job Created in System Scheduling Directory
id: e960de1c-4ab0-4b3e-8f79-f3da8ee1630e
status: experimental
description: |
    Detects creation or modification of files in system cron directories.
    Cron is the most durable and most widely used Linux persistence
    mechanism, and entries placed in cron.d or the periodic directories run
    as root without any further privilege requirement.
references:
    - https://attack.mitre.org/techniques/T1053/003/
    - https://man7.org/linux/man-pages/man5/crontab.5.html
author: Mary Amoah
date: 2026-08-02
tags:
    - attack.persistence
    - attack.t1053.003
    - attack.privilege_escalation
logsource:
    product: linux
    category: file_event
    definition: |
        Requires auditd watch rules on cron paths, or Sysmon for Linux
        Event ID 11. Without a filesystem watch this rule cannot fire.
detection:
    selection:
        TargetFilename|startswith:
            - '/etc/cron.d/'
            - '/etc/cron.daily/'
            - '/etc/cron.hourly/'
            - '/etc/cron.monthly/'
            - '/etc/cron.weekly/'
            - '/var/spool/cron/crontabs/'
    filter_optional_package_manager:
        Image|endswith:
            - '/dpkg'
            - '/rpm'
            - '/yum'
            - '/dnf'
            - '/apt'
    condition: selection and not 1 of filter_optional_*
falsepositives:
    - Configuration management tooling such as Ansible, Puppet or Chef
      deploying scheduled maintenance jobs.
    - Application installers registering log rotation or cleanup tasks.
level: medium
