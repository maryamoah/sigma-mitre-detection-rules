---
title: Local Account Created or Granted Sudo Privileges
id: 61c29b96-4e2f-44aa-a3b1-7052244dcd37
status: experimental
description: |
    Detects creation of local accounts, addition of users to privileged
    groups, and direct edits to sudoers configuration. Creating a backdoor
    account with sudo rights is a durable persistence route that survives
    credential rotation and often blends into normal administration.
references:
    - https://attack.mitre.org/techniques/T1136/001/
    - https://attack.mitre.org/techniques/T1098/
author: Mary Amoah
date: 2026-08-02
tags:
    - attack.persistence
    - attack.t1136.001
    - attack.t1098
logsource:
    product: linux
    category: process_creation
detection:
    selection_useradd:
        CommandLine|contains:
            - 'useradd '
            - 'adduser '
    selection_group:
        CommandLine|contains:
            - 'usermod -aG sudo'
            - 'usermod -aG wheel'
            - 'usermod -G sudo'
            - 'gpasswd -a'
    selection_sudoers:
        CommandLine|contains:
            - '/etc/sudoers.d/'
            - 'NOPASSWD:ALL'
            - 'NOPASSWD: ALL'
    condition: 1 of selection_*
falsepositives:
    - Legitimate account provisioning by IT or by configuration management,
      which should correlate with an onboarding record.
    - Application installers creating dedicated service accounts.
level: medium
