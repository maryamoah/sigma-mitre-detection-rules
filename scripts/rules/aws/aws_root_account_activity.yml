---
title: AWS Root Account Console Login or API Usage
id: e3adeb06-9530-4770-b4d0-8fc360872819
status: experimental
description: |
    Detects activity performed by the AWS account root user. Root should be
    used only for a small set of tasks that genuinely require it, and most
    organisations lock it away with hardware MFA after initial setup. Any root
    activity outside a documented break-glass procedure warrants immediate
    verification.
references:
    - https://attack.mitre.org/techniques/T1078/004/
    - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-user.html
author: Mary Amoah
date: 2026-08-02
tags:
    - attack.privilege_escalation
    - attack.t1078.004
    - attack.defense_evasion
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        userIdentity.type: 'Root'
    filter_main_service_events:
        eventType: 'AwsServiceEvent'
    condition: selection and not filter_main_service_events
falsepositives:
    - Documented break-glass access during an incident or an account recovery.
      This should be rare and traceable to an approval.
    - Billing and support tasks that still require root, such as changing the
      account contact or closing the account.
level: high
