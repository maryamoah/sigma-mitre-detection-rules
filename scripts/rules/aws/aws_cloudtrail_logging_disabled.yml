---
title: AWS CloudTrail Logging Disabled or Trail Deleted
id: ae8e2adc-4555-460c-abbb-b9b31c5a24bf
status: experimental
description: |
    Detects CloudTrail trails being stopped, deleted or reconfigured to
    exclude events. CloudTrail is the primary audit source in an AWS account,
    so disabling it blinds every downstream detection. There is almost no
    legitimate reason to stop a production trail, which makes this one of the
    highest-fidelity detections available in AWS.
references:
    - https://attack.mitre.org/techniques/T1562/008/
    - https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-concepts.html
author: Mary Amoah
date: 2026-08-02
tags:
    - attack.defense_evasion
    - attack.t1562.008
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: 'cloudtrail.amazonaws.com'
        eventName:
            - 'StopLogging'
            - 'DeleteTrail'
            - 'UpdateTrail'
            - 'PutEventSelectors'
    filter_main_error:
        errorCode|contains: 'UnauthorizedOperation'
    condition: selection and not filter_main_error
falsepositives:
    - Infrastructure-as-code deployments that recreate trails during a stack
      update. Confirm the caller is a known deployment role.
    - Deliberate consolidation of trails during account restructuring.
level: critical
