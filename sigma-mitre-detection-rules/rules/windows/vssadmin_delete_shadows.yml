title: Shadow Copy Deletion with VSSAdmin
id: 7d53916d-f195-41ce-8abe-e259519e729d
status: experimental
description: Detects vssadmin deleting volume shadow copies, often observed before ransomware impact.
references:
- https://attack.mitre.org/techniques/T1490/
author: Mary Amoah
date: '2026-08-02'
tags:
- attack.impact
- attack.t1490
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: \vssadmin.exe
    CommandLine|contains|all:
    - delete
    - shadows
  condition: selection
falsepositives:
- Authorized backup maintenance or disaster-recovery testing.
level: critical
