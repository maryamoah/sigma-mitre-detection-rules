title: Windows Account Discovery Commands
id: 7b8b9c32-4229-45db-bd7c-78b356a33536
status: experimental
description: Detects common native commands used to enumerate users, groups, or domain trust information.
references:
- https://attack.mitre.org/techniques/T1087/002/
author: Mary Amoah
date: '2026-08-02'
tags:
- attack.discovery
- attack.t1087.002
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith:
    - \net.exe
    - \net1.exe
    - \nltest.exe
    - \whoami.exe
    CommandLine|contains:
    - ' user'
    - ' group'
    - ' localgroup'
    - ' /domain'
    - ' /dclist'
    - ' /domain_trusts'
    - ' /all'
  condition: selection
falsepositives:
- Helpdesk diagnostics, login scripts, inventory tools, and domain administration.
level: medium
