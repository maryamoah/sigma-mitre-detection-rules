title: Remote Desktop Logon from External Address
id: c623c5d9-d831-4105-b814-9d62163ddeca
status: experimental
description: Detects successful RDP logons where the source address is not loopback.
references:
- https://attack.mitre.org/techniques/T1021/001/
author: Mary Amoah
date: '2026-08-02'
tags:
- attack.lateral_movement
- attack.t1021.001
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4624
    LogonType: 10
  filter_loopback:
    IpAddress:
    - 127.0.0.1
    - ::1
    - '-'
  condition: selection and not filter_loopback
falsepositives:
- Approved remote administration, helpdesk activity, or jump-host access.
level: medium
