title: Suspicious LSASS Process Access
id: a1a527b1-53f2-4d79-947f-3e9e7f87585d
status: experimental
description: Detects process access to LSASS with access rights often associated with credential dumping.
references:
- https://attack.mitre.org/techniques/T1003/001/
author: Mary Amoah
date: '2026-08-02'
tags:
- attack.credential_access
- attack.t1003.001
logsource:
  product: windows
  category: process_access
detection:
  selection:
    TargetImage|endswith: \lsass.exe
    GrantedAccess:
    - '0x1010'
    - '0x1410'
    - '0x1438'
    - '0x1fffff'
  filter_known:
    SourceImage|endswith:
    - \MsMpEng.exe
    - \csrss.exe
  condition: selection and not filter_known
falsepositives:
- Security products, diagnostic utilities, and approved memory acquisition tools.
level: high
