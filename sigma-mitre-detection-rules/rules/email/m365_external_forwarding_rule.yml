title: Microsoft 365 Inbox Forwarding Rule Created
id: 20e3c02f-b3c5-4d66-8439-d5b7f66bef6b
status: experimental
description: Detects creation or modification of an Exchange Online inbox rule that forwards messages externally.
references:
- https://attack.mitre.org/techniques/T1114/003/
author: Mary Amoah
date: '2026-08-02'
tags:
- attack.collection
- attack.t1114.003
logsource:
  product: m365
  service: audit
detection:
  selection_operation:
    Operation:
    - New-InboxRule
    - Set-InboxRule
  selection_forward:
    Parameters|contains:
    - ForwardTo
    - ForwardAsAttachmentTo
    - RedirectTo
  condition: selection_operation and selection_forward
falsepositives:
- Legitimate mailbox delegation, business workflow automation, or approved external forwarding.
level: high
