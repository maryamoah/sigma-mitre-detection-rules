title: AWS CloudTrail Logging Disabled
id: e30e375b-8cac-474e-8b63-e93ef08cd23b
status: experimental
description: Detects API calls that stop CloudTrail logging or delete a trail.
references:
- https://attack.mitre.org/techniques/T1562/008/
author: Mary Amoah
date: '2026-08-02'
tags:
- attack.defense_evasion
- attack.t1562.008
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: cloudtrail.amazonaws.com
    eventName:
    - StopLogging
    - DeleteTrail
    - UpdateTrail
  condition: selection
falsepositives:
- Authorized infrastructure changes, account decommissioning, or trail consolidation.
level: high
